[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batill"
version = "0.2.0"
description = "Full-paper processing for a map of private equity research"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
extract = ["marker-pdf==2.0.0"]
embed = ["sentence-transformers==5.7.0", "transformers>=5.16,<6", "torch>=2.7,<3", "huggingface-hub>=0.30"]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10,<1"]
analysis = ["scipy>=1.11,<2", "matplotlib>=3.7,<4", "scikit-learn>=1.3,<2", "umap-learn>=0.5,<1", "plotly>=5,<7"]
graph = ["igraph>=0.11,<2", "leidenalg>=0.10,<1"]
citations = ["requests>=2.31,<3", "networkx>=3,<4", "scipy>=1.11,<2"]
test = ["pytest>=8"]
report = ["python-docx>=1.2,<2"]
institutions = ["openpyxl>=3.1,<4"]
cleaning = ["openpyxl>=3.1,<4"]
readability = ["textstat==0.7.13", "nltk==3.10.3", "pyphen==0.18.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
